<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>筋トレ記録</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="icons/icon-h-32.png">
    <link rel="apple-touch-icon" href="icons/icon-h-180.png">
</head>
<body>
<div class="container">
    <div class="app-shell">
        <header class="app-header">
            <span class="app-header-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/>
                </svg>
            </span>
            <div class="app-header-text">
                <h1>筋トレ記録</h1>
                <p id="appHeaderDate" class="app-header-date"></p>
            </div>
        </header>

        <nav class="app-tabs" role="tablist">
            <button type="button" id="tabTodayBtn" class="app-tab-btn" role="tab"
                    aria-selected="true" aria-controls="todayView" data-tab="today">今日のトレーニング</button>
            <button type="button" id="tabRoutinesBtn" class="app-tab-btn" role="tab"
                    aria-selected="false" aria-controls="routinesView" data-tab="routines">ルーティーン管理</button>
        </nav>

        <div id="todayView" role="tabpanel" aria-labelledby="tabTodayBtn">
            <div id="weekStrip" class="week-strip"></div>
            <div id="trainingCard" class="training-card"></div>
        </div>

        <div id="routinesView" class="app-main hidden" role="tabpanel" aria-labelledby="tabRoutinesBtn">
            <div class="training-header">
                <span class="training-title">ルーティーン管理</span>
            </div>
            <p class="routine-management-intro">
                1〜数日分のトレーニングメニュー(ルーティーン)をここで作成・編集できます。↕ボタンをドラッグして並び替えた順番どおりに、次に行うメニューが選ばれます。
            </p>
            <div id="routineManagementEditor" class="training-routine-editor"></div>
        </div>

        <footer class="app-footer">
            <p>筋トレ記録・このブラウザだけに保存されます</p>
            <!-- ホーム画面に追加した状態ではアドレスバーが無く、更新が
                 届かない時に手動で読み込み直す手段がないため、その逃げ道。 -->
            <button type="button" id="appReloadBtn" class="app-reload-btn">最新の状態に更新</button>
            <p id="appVersionLine" class="app-version-line"></p>
        </footer>
    </div>
</div>

<div id="bootError" class="boot-error hidden">
    読み込みに失敗しました。<br>
    ページを再読み込みしてください。
</div>

<div id="toastContainer" class="toast-container"></div>

<!-- Silent audio sink for the training rest timer's beep: iOS Safari mutes
     <audio>/Web Audio output during the hardware silent switch, but a
     <video> element's audio is treated as media playback and ignores it.
     Not display:none (some browsers pause playback of a fully-hidden
     video), just made visually invisible. -->
<video id="restAlarmAudioSink" playsinline aria-hidden="true" style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;"></video>

<script src="js/app.js"></script>
<script>
    setTimeout(function () {
        if (!window.__appBooted) {
            document.getElementById('bootError').classList.remove('hidden');
        }
    }, 4000);
</script>
</body>
</html>
